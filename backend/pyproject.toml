[project]
name = "master-foundation-api"
version = "0.1.0"
description = "AI-Native Master Foundation API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.5",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "pydantic-ai>=0.0.12",
    "google-genai>=0.3.0",
    "procrastinate>=3.3.0",
    "psycopg[binary]>=3.1.18",
    "httpx>=0.27.0",
    "pgvector>=0.2.5",
    "psutil>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = [
    "B008", # FastAPI dependency injection: Depends(...) in route defaults
]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated migrations: long lines and template typing style
"alembic/versions/*.py" = ["E501", "UP007", "UP035", "I001"]
"alembic/env.py" = ["E501", "I001"]
