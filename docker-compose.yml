# docker-compose.yml
# Run all commands from this directory (project root), not from a parent path.
# Each service builds with context restricted to ./backend or ./frontend only.

services:
  database:
    # Must match the major version used when `postgres_data` was first created (15 vs 16 are incompatible).
    # Fresh dev: either tag works; to move PG15 data → PG16 use pg_upgrade or dump/restore, not just retag.
    image: pgvector/pgvector:pg15
    container_name: mf-postgres
    # Fixed dev credentials so a bad repo-root `.env` cannot desync API vs Postgres.
    # Postgres only reads these on first volume init; existing data keeps the old password until you
    # `docker compose down -v` or ALTER USER. Match `env.example` when using host tools (port 5433).
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: master_foundation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Host 5432 is often taken by a local Postgres; backend still uses database:5432 on the compose network.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mf-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      # Same default as frontend; maps to JWT via AUTH_SECRET alias (see backend config)
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-min-32-chars}
      POSTGRES_SERVER: database
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: master_foundation
      # One API replica × capped workers × (pool + overflow) must stay < Postgres max_connections
      WEB_CONCURRENCY: "2"
      # Phase 16: Procrastinate worker (separate container/process) calls back into this API
      REALTIME_PUSH_BASE_URL: http://backend:8000
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=4)"',
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 45s
    volumes:
      - backend_uploads:/app/data/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-min-32-chars}
    container_name: mf-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-min-32-chars}
      AUTH_URL: ${AUTH_URL:-http://localhost:3001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      # Server-side login from Next.js → FastAPI inside Compose network
      INTERNAL_API_URL: http://backend:8000/api/v1
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:
