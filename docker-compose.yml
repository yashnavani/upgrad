# docker-compose.yml
# Run all commands from this directory (project root), not from a parent path.
# Each service builds with context restricted to ./backend or ./frontend only.

services:
  database:
    # Must match the major version used when `postgres_data` was first created (15 vs 16 are incompatible).
    # Fresh dev: either tag works; to move PG15 data → PG16 use pg_upgrade or dump/restore, not just retag.
    image: pgvector/pgvector:pg15
    container_name: mf-postgres
    # Fixed dev credentials so a bad repo-root `.env` cannot desync API vs Postgres.
    # Postgres only reads these on first volume init; existing data keeps the old password until you
    # `docker compose down -v` or ALTER USER. Match `env.example` when using host tools (port 5433).
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: master_foundation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Host 5432 is often taken by a local Postgres; backend still uses database:5432 on the compose network.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mf-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mf-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      SYSTEM_ACTOR_USER_ID: ${SYSTEM_ACTOR_USER_ID:-}
      POSTGRES_SERVER: database
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: master_foundation
      # One API replica × capped workers × (pool + overflow) must stay < Postgres max_connections
      WEB_CONCURRENCY: "2"
      # Phase 16: worker container hits this URL; must match worker INTERNAL_REALTIME_SECRET
      REALTIME_PUSH_BASE_URL: http://backend:8000
      INTERNAL_REALTIME_SECRET: ${INTERNAL_REALTIME_SECRET:-dev-internal-realtime-secret-change-in-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: >
      sh -c "alembic upgrade head
      && (procrastinate --app=app.core.worker.app healthchecks
      || procrastinate --app=app.core.worker.app schema --apply)
      && gunicorn -c gunicorn_conf.py app.main:app"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/api/v1/health'', timeout=4)"',
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 45s
    volumes:
      - backend_uploads:/app/data/uploads

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mf-worker
    env_file:
      - ./.env
    environment:
      SYSTEM_ACTOR_USER_ID: ${SYSTEM_ACTOR_USER_ID:-}
      POSTGRES_SERVER: database
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: master_foundation
      REALTIME_PUSH_BASE_URL: http://backend:8000
      INTERNAL_REALTIME_SECRET: ${INTERNAL_REALTIME_SECRET:-dev-internal-realtime-secret-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    command: >
      sh -c "(procrastinate --app=app.core.worker.app healthchecks
      || procrastinate --app=app.core.worker.app schema --apply)
      && procrastinate --app=app.core.worker.app worker"
    depends_on:
      database:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_SYSTEM_USER_ID: ${NEXT_PUBLIC_SYSTEM_USER_ID:-}
    container_name: mf-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_SYSTEM_USER_ID: ${NEXT_PUBLIC_SYSTEM_USER_ID:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:
